name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bidlock
          POSTGRES_PASSWORD: bidlock
          POSTGRES_DB: bidlock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bidlock"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL_TEST: postgres://bidlock:bidlock@localhost:5432/bidlock_test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: |
          npm run typecheck -w api
          npx tsc -p apps/web
      - name: Tests (real Postgres, concurrency + invariants)
        run: npm test
      - name: Build
        run: npm run build
